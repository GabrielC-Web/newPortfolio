<section class="w-full flex flex-col items-center gap-8 p-4 h-fit">

  <img loading="lazy" [src]="image" class="max-w-[300px] rounded-lg" alt=" Just an image of a chill sexy programmer">

  <p>{{description}}</p>

  <!-- Botón de enviar -->
  <button
    [ngClass]="theme.name == 'Light'? ' border border-solid !border-[#303030] ':' !border !border-solid !border-[#fff] '"
    class="sm:w-6/12 w-full border border-solid mt-8 p-2 active:!border-angel-green active:!text-angel-green rounded"
    (click)="downloadCV()">
    Descargar CV
  </button>

</section>
