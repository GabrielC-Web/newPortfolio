<form class="flex justify-center flex-col w-full items-center p-0" [formGroup]="contactForm">

  <!-- Título -->
  <h3 class="text-center">¡Contáctame!</h3>

  <!-- Contenedor de los inputs -->
  <div class="flex my-4 flex-col w-full gap-8 sm:gap-4">

    <!-- Nombre -->
    <mat-form-field color="accent" appearance="outline">

      <mat-label color="accent">Nombre</mat-label>
      <input matInput class="p-2" type="text" placeholder="Gabriel Carreño" formControlName="name">

      <!-- Mensajes de error -->
      <mat-error *ngIf="contactForm.controls['name'].errors?.['required']">
        Debe escribir un nombre
      </mat-error>

    </mat-form-field>

    <!-- Correo -->
    <mat-form-field color="accent" appearance="outline">

      <mat-label color="accent">Correo electrónico</mat-label>
      <input matInput class="p-2" type="text" placeholder="mail_example@gmail.com" formControlName="email">

      <!-- Mensajes de error -->
      <mat-error *ngIf="contactForm.controls['email'].errors?.['required']">
        Debe escribir un correo
      </mat-error>

      <mat-error
        *ngIf="contactForm.controls['email'].errors?.['email'] && !contactForm.controls['email'].errors?.['required']">
        El correo ingresado no es válido
      </mat-error>

    </mat-form-field>

    <!-- Correo -->
    <mat-form-field color="accent" appearance="outline">

      <mat-label color="accent">Asunto</mat-label>
      <textarea matInput class="p-2" placeholder="mail_example@gmail.com" formControlName="subject"></textarea>

      <!-- Mensajes de error -->
      <mat-error *ngIf="contactForm.controls['subject'].errors?.['required']">
        Debe escribir un mensaje
      </mat-error>

    </mat-form-field>

  </div>

  <!-- Botón de enviar -->
  <button
    [ngClass]="theme.name == 'Light'? ' border border-solid !border-[#303030] ':' !border !border-solid !border-[#fff] '"
    class="sm:w-6/12 w-full border border-solid mt-8 p-2 active:!border-angel-green active:!text-angel-green rounded"
    (click)="onSubmit()">
    Enviar
  </button>

</form>
